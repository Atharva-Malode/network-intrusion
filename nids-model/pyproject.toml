[project]
name = "nids-model"
version = "0.1.0"
description = "Reproducible NSL-KDD network-intrusion detection model (train + inference)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "joblib>=1.4.0",
    "imbalanced-learn>=0.12.0",  # SVM-SMOTE for reproduce_paper.py
    "xgboost>=2.0.0",            # rare-class booster for improve_rare_v2.py
]
